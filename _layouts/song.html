---
layout: default
---

<div id="song-body">
    <div id="link-list">
        {% if page.decapo %}
        <a class="download" href="/files/song_pdfs/{{ page.slug }}.capo.pdf" target="_blank">Download (w/ capo)</a>
        <a class="download" href="/files/song_pdfs/{{ page.slug }}.pdf" target="_blank">Download (w/o capo)</a>
        {% else %}
        <a class="download" href="/files/song_pdfs/{{ page.slug }}.pdf" target="_blank">Download</a>
        {% endif %}

        <a class="listen" target="_blank">Listen</a>
    </div>
</div>

<script src="/js/chordsheet.js"></script>
<script src="/js/chordsheet-helpers.js"></script>
<script src="/js/chordchart-helpers.js"></script>
<script src="https://omnibrain.github.io/svguitar/js/svguitar.umd.js"></script>

<script>
    const chordPro = `
    {{ content }}
     `;
    const song = insertSong(chordPro);
    renderChordsForSong(song)
        .catch(error => {
            console.error('Error rendering chords.', {
                song: song,
                error,
            });
        });
</script>
